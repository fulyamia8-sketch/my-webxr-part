<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CPR — Marker then WebXR Test</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101820;color:white;font-family:system-ui,sans-serif}
#status{position:fixed;z-index:20;top:12px;left:12px;right:12px;background:#000c;padding:13px;border-radius:12px;line-height:1.4;font-size:14px;pointer-events:none}
#action{position:fixed;z-index:30;bottom:26px;left:50%;transform:translateX(-50%);padding:14px 22px;border:0;border-radius:30px;background:#16c9b3;color:#032a28;font-weight:700;font-size:16px;white-space:nowrap}
#action:disabled{opacity:.5}#scan{position:fixed;inset:0;z-index:3}#scan iframe{border:0;width:100%;height:100%}
#xrCanvas{position:fixed;inset:0;z-index:1}#scan[hidden]{display:none}
</style>
</head>
<body>
<div id="scan" hidden></div><div id="status">Step 1: Scan the printed CPR marker. The camera will close before WebXR starts.</div>
<button id="action">Scan marker</button>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const status=document.querySelector('#status'),button=document.querySelector('#action'),scan=document.querySelector('#scan');
let phase='idle',found=false,activeSession=null,hitSource=null,refSpace=null,hitRequested=false,starting=false;
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.01,30);
const renderer=new THREE.WebGLRenderer({alpha:true,antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.xr.enabled=true;renderer.xr.setReferenceSpaceType('local');renderer.domElement.id='xrCanvas';document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x777777,2));
const cube=new THREE.Mesh(new THREE.BoxGeometry(.16,.16,.16),new THREE.MeshBasicMaterial({color:0x00ff88}));cube.visible=false;cube.frustumCulled=false;scene.add(cube);
const ring=new THREE.Mesh(new THREE.RingGeometry(.07,.085,32).rotateX(-Math.PI/2),new THREE.MeshBasicMaterial({color:0xffffff,side:THREE.DoubleSide}));ring.matrixAutoUpdate=false;ring.visible=false;scene.add(ring);
let latestHitPose=null, lastPlacement=0, announcedSurface=false;
function placeCube(){
  if(phase!=='xr'||!activeSession)return;
  if(!latestHitPose){status.textContent='No surface detected yet. Point at a well-lit floor and move slowly until the white ring appears.';return;}
  const t=latestHitPose.transform;
  cube.position.set(t.position.x,t.position.y+0.08,t.position.z);
  cube.quaternion.identity();cube.visible=true;cube.updateMatrixWorld(true);
  lastPlacement=performance.now();
  status.textContent=`Cube placed at x=${cube.position.x.toFixed(2)}, y=${cube.position.y.toFixed(2)}, z=${cube.position.z.toFixed(2)}. Keep the chair leg in view and move slowly.`;
}
const controller=renderer.xr.getController(0);
controller.addEventListener('select',placeCube);
scene.add(controller);
// A DOM overlay can consume touch events instead of producing an XR select event.
// Accept a screen tap as a fallback, but only after the WebXR session has started.
document.addEventListener('pointerup',e=>{
  if(phase!=='xr'||!activeSession||e.target===button)return;
  if(performance.now()-lastPlacement<450)return;
  placeCube();
});
const scannerHTML=`<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><script src="https://aframe.io/releases/1.5.0/aframe.min.js"><\/script><script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"><\/script><style>body{margin:0;overflow:hidden}#label{position:fixed;z-index:99;top:110px;left:15px;right:15px;color:white;text-align:center;text-shadow:0 1px 5px black;font:16px system-ui}</style></head><body><div id="label">Point camera at the printed marker</div><a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: true;" embedded color-space="sRGB" renderer="colorManagement: true" vr-mode-ui="enabled:false" device-orientation-permission-ui="enabled:false"><a-assets></a-assets><a-camera position="0 0 0" look-controls="enabled:false"></a-camera><a-entity id="target" mindar-image-target="targetIndex: 0"><a-box position="0 0 .1" scale=".1 .1 .1" color="#16c9b3"></a-box></a-entity></a-scene><script>document.querySelector('#target').addEventListener('targetFound',()=>{document.querySelector('#label').textContent='Marker detected!';parent.postMessage({type:'cpr-marker-found'},'*')});window.addEventListener('message',async e=>{if(e.data?.type==='cpr-stop-scan'){try{await document.querySelector('a-scene').systems['mindar-image-system'].stop()}catch(_){}parent.postMessage({type:'cpr-scan-stopped'},'*')}});<\/script></body></html>`;
function setButton(text,enabled=true){button.textContent=text;button.disabled=!enabled;button.style.display='';}
function beginScan(){found=false;phase='scanning';scan.hidden=false;const iframe=document.createElement('iframe');iframe.allow='camera';iframe.srcdoc=scannerHTML;scan.replaceChildren(iframe);status.textContent='Point the camera at your printed marker. Make sure targets.mind is in this GitHub folder.';setButton('Waiting for marker...',false);}
window.addEventListener('message',e=>{if(e.source!==scan.querySelector('iframe')?.contentWindow)return;if(e.data?.type==='cpr-marker-found'&&!found&&phase==='scanning'){found=true;phase='detected';status.textContent='Marker detected! Press Continue to close marker camera, then start WebXR.';setButton('Continue to WebXR');}});
async function stopScan(){phase='stopping';setButton('Closing marker camera...',false);const iframe=scan.querySelector('iframe');if(iframe){iframe.contentWindow.postMessage({type:'cpr-stop-scan'},'*');await new Promise(resolve=>{const listener=e=>{if(e.source===iframe.contentWindow&&e.data?.type==='cpr-scan-stopped'){window.removeEventListener('message',listener);resolve();}};window.addEventListener('message',listener);setTimeout(()=>{window.removeEventListener('message',listener);resolve();},1800);});}scan.replaceChildren();scan.hidden=true;phase='ready';status.textContent='Marker scan completed. Point at the same physical area, then press Start WebXR. Tap the white ring near the marker to place the cube.';setButton('Start WebXR');}
function resetHit(){try{hitSource?.cancel()}catch(_){}hitSource=null;refSpace=null;hitRequested=false;ring.visible=false;latestHitPose=null;announcedSurface=false;}
async function startXR(){if(starting||activeSession)return;starting=true;setButton('Starting AR...',false);let session=null;try{if(!navigator.xr||!await navigator.xr.isSessionSupported('immersive-ar'))throw new Error('immersive-ar not supported on this device/browser');resetHit();cube.visible=false;session=await navigator.xr.requestSession('immersive-ar',{requiredFeatures:['local','hit-test'],optionalFeatures:['dom-overlay'],domOverlay:{root:document.body}});activeSession=session;session.addEventListener('end',()=>{if(activeSession===session)activeSession=null;resetHit();phase='ready';status.textContent='WebXR ended. Press Start WebXR to try again.';setButton('Start WebXR');},{once:true});await renderer.xr.setSession(session);phase='xr';button.style.display='none';status.textContent='Looking for a floor or table... Move slowly. When the white ring appears, tap to place the green cube.';}catch(e){if(session){try{await session.end()}catch(_){}}activeSession=null;phase='ready';status.textContent='WebXR error: '+(e?.message||e);setButton('Try WebXR again');}finally{starting=false;}}
button.addEventListener('click',()=>{if(phase==='idle')beginScan();else if(phase==='detected')stopScan();else if(phase==='ready')startXR();});
renderer.setAnimationLoop((_,frame)=>{if(frame&&activeSession){if(!hitRequested){hitRequested=true;const session=activeSession;Promise.all([session.requestReferenceSpace('viewer'),session.requestReferenceSpace('local')]).then(async ([viewer,local])=>{if(activeSession!==session)return;refSpace=local;const source=await session.requestHitTestSource({space:viewer});if(activeSession===session)hitSource=source;else source.cancel();}).catch(e=>{status.textContent='Hit-test error: '+e.message;});}if(hitSource&&refSpace){const hits=frame.getHitTestResults(hitSource);const pose=hits.length?hits[0].getPose(refSpace):null;latestHitPose=pose;ring.visible=!!pose;if(pose&&!announcedSurface){announcedSurface=true;status.textContent='Surface found! Tap the screen to place the green cube.';}if(pose){ring.position.set(pose.transform.position.x,pose.transform.position.y,pose.transform.position.z);ring.quaternion.set(pose.transform.orientation.x,pose.transform.orientation.y,pose.transform.orientation.z,pose.transform.orientation.w);ring.updateMatrix();}}}renderer.render(scene,camera);});
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script></body></html>
