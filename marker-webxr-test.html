
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CPR — Marker + WebXR Diagnostic</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101820;color:#fff;font-family:system-ui,sans-serif}
#status{position:fixed;z-index:20;top:10px;left:10px;right:10px;padding:12px;border-radius:10px;background:#000c;font-size:13px;line-height:1.45;pointer-events:none;white-space:pre-line}
#controls{position:fixed;z-index:30;bottom:22px;left:8px;right:8px;display:flex;gap:7px;justify-content:center;flex-wrap:wrap}
button{border:0;border-radius:25px;background:#17cbb4;color:#042b28;padding:13px 16px;font-weight:700;font-size:14px}
button:disabled{opacity:.45}
#scan{position:fixed;inset:0;z-index:3}
#scan iframe{border:0;width:100%;height:100%}
#scan[hidden], [hidden]{display:none!important}
#xrCanvas{position:fixed;inset:0;z-index:1}
</style>
</head>
<body>
<div id="scan" hidden></div>
<div id="status">Step 1: Scan the printed CPR marker.</div>
<div id="controls">
<button id="action">Scan marker</button>
<button id="testCube" hidden>Show Test Cube</button>
<button id="place" hidden disabled>Place on Surface</button>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';

const status=document.querySelector('#status'),
action=document.querySelector('#action'),
scan=document.querySelector('#scan');
const testButton=document.querySelector('#testCube'),
placeButton=document.querySelector('#place');

let phase='idle',found=false,session=null,hitSource=null,
viewerSpace=null,hitPose=null,requesting=false,hitCount=0,lastMessage=0;

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.01,100);
const renderer=new THREE.WebGLRenderer({alpha:true,antialias:true});

renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.xr.enabled=true;
renderer.xr.setReferenceSpaceType('local');
renderer.domElement.id='xrCanvas';
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x777777,2));

const cube=new THREE.Mesh(
 new THREE.BoxGeometry(.18,.18,.18),
 new THREE.MeshBasicMaterial({
  color:0x00ff66,
  depthTest:false,
  depthWrite:false
 })
);
cube.visible=false;
cube.frustumCulled=false;
cube.renderOrder=20;
scene.add(cube);

const edges=new THREE.LineSegments(
 new THREE.EdgesGeometry(cube.geometry),
 new THREE.LineBasicMaterial({color:0x002211,depthTest:false})
);
cube.add(edges);

const ring=new THREE.Mesh(
 new THREE.RingGeometry(.07,.09,32).rotateX(-Math.PI/2),
 new THREE.MeshBasicMaterial({
  color:0xffffff,
  side:THREE.DoubleSide,
  depthTest:false,
  depthWrite:false
 })
);
ring.matrixAutoUpdate=false;
ring.visible=false;
ring.frustumCulled=false;
ring.renderOrder=10;
scene.add(ring);

const scannerHTML=`<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"><\/script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"><\/script>
<style>
body{margin:0;overflow:hidden}
#label{position:fixed;z-index:99;top:110px;left:15px;right:15px;color:white;text-align:center;text-shadow:0 1px 5px black;font:16px system-ui}
</style>
</head>
<body>
<div id="label">Point camera at the printed marker</div>
<a-scene
 mindar-image="imageTargetSrc: ./targets.mind; autoStart: true;"
 embedded
 color-space="sRGB"
 renderer="colorManagement: true"
 vr-mode-ui="enabled:false"
 device-orientation-permission-ui="enabled:false">
 <a-assets></a-assets>
 <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>
 <a-entity id="target" mindar-image-target="targetIndex: 0">
  <a-box position="0 0 .1" scale=".1 .1 .1" color="#16c9b3"></a-box>
 </a-entity>
</a-scene>
<script>
document.querySelector('#target').addEventListener('targetFound',()=>{
 document.querySelector('#label').textContent='Marker detected!';
 parent.postMessage({type:'cpr-marker-found'},'*');
});
window.addEventListener('message',async e=>{
 if(e.data?.type==='cpr-stop-scan'){
  try{
   await document.querySelector('a-scene').systems['mindar-image-system'].stop();
  }catch(_){}
  parent.postMessage({type:'cpr-scan-stopped'},'*');
 }
});
<\/script>
</body>
</html>`;

function beginScan(){
 phase='scanning';
 found=false;
 scan.hidden=false;
 const iframe=document.createElement('iframe');
 iframe.allow='camera';
 iframe.srcdoc=scannerHTML;
 scan.replaceChildren(iframe);
 action.textContent='Waiting for marker...';
 action.disabled=true;
 status.textContent='Point camera at the printed marker.';
}

window.addEventListener('message',e=>{
 if(e.source!==scan.querySelector('iframe')?.contentWindow)return;
 if(e.data?.type==='cpr-marker-found'&&phase==='scanning'&&!found){
  found=true;
  phase='detected';
  status.textContent='Marker detected. Continue to WebXR.';
  action.textContent='Continue to WebXR';
  action.disabled=false;
 }
});

async function stopScan(){
 phase='stopping';
 action.disabled=true;
 const iframe=scan.querySelector('iframe');
 if(iframe){
  iframe.contentWindow.postMessage({type:'cpr-stop-scan'},'*');
  await new Promise(resolve=>{
   let done=false;
   const handler=e=>{
    if(e.source===iframe.contentWindow&&e.data?.type==='cpr-scan-stopped'){
     done=true;
     window.removeEventListener('message',handler);
     resolve();
    }
   };
   window.addEventListener('message',handler);
   setTimeout(()=>{
    if(!done){
     window.removeEventListener('message',handler);
     resolve();
    }
   },2000);
  });
 }
 scan.replaceChildren();
 scan.hidden=true;
 phase='ready';
 action.textContent='Start WebXR';
 action.disabled=false;
 status.textContent='Marker recognized. Now start the separate WebXR camera.';
}

function resetXR(){
 try{hitSource?.cancel()}catch(_){}
 hitSource=null;
 viewerSpace=null;
 hitPose=null;
 requesting=false;
 hitCount=0;
 ring.visible=false;
 placeButton.disabled=true;
 testButton.hidden=true;
 placeButton.hidden=true;
}

async function startXR(){
 if(session)return;
 action.disabled=true;
 let created=null;
 try{
  if(!navigator.xr||!await navigator.xr.isSessionSupported('immersive-ar')){
   throw new Error('WebXR immersive-ar is not supported');
  }
  resetXR();
  cube.visible=false;
  created=await navigator.xr.requestSession('immersive-ar',{
   requiredFeatures:['local','hit-test'],
   optionalFeatures:['dom-overlay'],
   domOverlay:{root:document.body}
  });
  session=created;
  created.addEventListener('end',()=>{
   if(session===created)session=null;
   resetXR();
   phase='ready';
   action.hidden=false;
   action.disabled=false;
   action.textContent='Start WebXR';
   status.textContent='AR ended. Start again to retest.';
  },{once:true});

  await renderer.xr.setSession(created);
  phase='xr';
  action.hidden=true;
  testButton.hidden=false;
  placeButton.hidden=false;
  status.textContent='AR started. FIRST tap Show Test Cube. It must appear directly in front of you. Then scan the floor to enable Place on Surface.';
 }catch(err){
  if(created){
   try{await created.end()}catch(_){}
  }
  session=null;
  phase='ready';
  action.hidden=false;
  action.disabled=false;
  action.textContent='Try WebXR again';
  status.textContent='WebXR error: '+err.message;
 }
}

action.addEventListener('click',()=>{
 if(phase==='idle')beginScan();
 else if(phase==='detected')stopScan();
 else if(phase==='ready')startXR();
});

testButton.addEventListener('click',()=>{
 if(phase!=='xr')return;

 const xrCamera=renderer.xr.getCamera(camera);
 xrCamera.updateMatrixWorld(true);
 const position=new THREE.Vector3();
 const direction=new THREE.Vector3();

 xrCamera.getWorldPosition(position);
 xrCamera.getWorldDirection(direction);

 cube.position.copy(position).addScaledVector(direction,.65);
 cube.quaternion.identity();
 cube.visible=true;
 cube.updateMatrixWorld(true);

 status.textContent='TEST CUBE placed 65 cm in front of camera (no surface needed). If you see it, rendering works. Now try Place on Surface.';
});

placeButton.addEventListener('click',()=>{
 if(phase!=='xr'||!hitPose){
  status.textContent='No surface pose yet. Try Show Test Cube first.';
  return;
 }

 const p=hitPose.transform.position;
 cube.position.set(p.x,p.y+.09,p.z);
 cube.quaternion.identity();
 cube.visible=true;
 cube.updateMatrixWorld(true);

 status.textContent=`SURFACE CUBE placed at (${p.x.toFixed(2)}, ${p.y.toFixed(2)}, ${p.z.toFixed(2)}). Move slowly and check whether it stays beside the marker.`;
});

renderer.setAnimationLoop((_,frame)=>{
 if(frame&&session){
  if(!requesting){
   requesting=true;
   const current=session;

   current.requestReferenceSpace('viewer')
    .then(async viewer=>{
     if(session!==current)return;
     viewerSpace=viewer;
     const src=await current.requestHitTestSource({space:viewer});
     if(session===current)hitSource=src;
     else src.cancel();
    })
    .catch(err=>{
     status.textContent='Hit-test setup error: '+err.message;
    });
  }

  if(hitSource){
   try{
    const reference=renderer.xr.getReferenceSpace();
    if(reference){
     const hits=frame.getHitTestResults(hitSource);
     hitCount=hits.length;
     hitPose=hits.length?hits[0].getPose(reference):null;
     ring.visible=!!hitPose;
     placeButton.disabled=!hitPose;

     if(hitPose){
      ring.matrix.fromArray(hitPose.transform.matrix);
      ring.matrixWorldNeedsUpdate=true;
     }

     if(!cube.visible&&performance.now()-lastMessage>1800){
      status.textContent=hitPose
       ?'Surface detected! White ring visible. Try Show Test Cube or Place on Surface.'
       :`AR running; hit-test results: ${hitCount}. Tap Show Test Cube to test rendering without a surface.`;
      lastMessage=performance.now();
     }
    }
   }catch(err){
    status.textContent='Hit-test error: '+err.message;
   }
  }
 }
 renderer.render(scene,camera);
});

window.addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
