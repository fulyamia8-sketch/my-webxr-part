<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  >

  <title>WebAR CPR Training</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <script>
    /*
      Automatically:
      - calculates the model size,
      - resizes it,
      - moves its centre to the marker centre.
    */
    AFRAME.registerComponent("auto-fit-model", {
      schema: {
        size: {
          type: "number",
          default: 0.7
        }
      },

      init: function () {
        this.el.addEventListener("model-loaded", () => {
          const model = this.el.getObject3D("mesh");

          if (!model) {
            console.error("Model mesh could not be found:", this.el.id);
            return;
          }

          model.updateMatrixWorld(true);
          this.el.object3D.updateMatrixWorld(true);

          let box = new THREE.Box3().setFromObject(model);
          const modelSize = new THREE.Vector3();

          box.getSize(modelSize);

          const largestDimension = Math.max(
            modelSize.x,
            modelSize.y,
            modelSize.z
          );

          if (
            !Number.isFinite(largestDimension) ||
            largestDimension <= 0
          ) {
            console.error("Model dimensions could not be calculated:", this.el.id);
            return;
          }

          const scaleFactor = this.data.size / largestDimension;

          model.scale.multiplyScalar(scaleFactor);
          model.updateMatrixWorld(true);
          this.el.object3D.updateMatrixWorld(true);

          // Recalculate centre after scaling.
          box = new THREE.Box3().setFromObject(model);

          const worldCentre = new THREE.Vector3();
          box.getCenter(worldCentre);

          const localCentre =
            this.el.object3D.worldToLocal(worldCentre.clone());

          // Move the internal model to the centre of its entity.
          model.position.sub(localCentre);

          model.updateMatrixWorld(true);
        });
      }
    });
  </script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #nextButton {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;

      min-width: 150px;
      padding: 14px 26px;

      border: none;
      border-radius: 10px;

      background-color: #1565c0;
      color: white;

      font-size: 18px;
      font-weight: 600;

      cursor: pointer;
    }
  </style>
</head>

<body>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind;"
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: true"
    loading-screen="enabled: true; dotsColor: #1565C0; backgroundColor: #FFFFFF;"
  >

    <!-- 3D model files -->
    <a-assets timeout="60000">
      <a-asset-item
        id="asset0"
        src="./models/patient.glb">
      </a-asset-item>

      <a-asset-item
        id="asset1"
        src="./models/smartphone.glb">
      </a-asset-item>

      <a-asset-item
        id="asset2"
        src="./models/head.glb">
      </a-asset-item>

      <a-asset-item
        id="asset3"
        src="./models/lungs.glb">
      </a-asset-item>

      <a-asset-item
        id="asset4"
        src="./models/hand.glb">
      </a-asset-item>

      <a-asset-item
        id="asset5"
        src="./models/heart.glb">
      </a-asset-item>

      <a-asset-item
        id="asset6"
        src="./models/alarm_clock.glb">
      </a-asset-item>

      <a-asset-item
        id="asset7"
        src="./models/ambulance.glb">
      </a-asset-item>
    </a-assets>

    <!-- Lights make GLB models easier to see -->
    <a-light
      type="ambient"
      color="#FFFFFF"
      intensity="1.5">
    </a-light>

    <a-light
      type="directional"
      color="#FFFFFF"
      intensity="1.5"
      position="1 2 3">
    </a-light>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <!-- Everything inside this entity is attached to the marker -->
    <a-entity mindar-image-target="targetIndex: 0">

      <!-- Step 1: Patient -->
      <a-entity
        id="model0"
        position="0 -0.03 0.18"
        rotation="0 0 0"
        visible="true">

        <a-entity
          gltf-model="#asset0"
          auto-fit-model="size: 0.8">
        </a-entity>
      </a-entity>

      <!-- Step 2: Smartphone -->
      <a-entity
        id="model1"
        position="0 -0.03 0.18"
        rotation="0 0 0"
        visible="false">

        <a-entity
          gltf-model="#asset1"
          auto-fit-model="size: 0.55">
        </a-entity>
      </a-entity>

      <!-- Step 3: Head / airway -->
      <a-entity
        id="model2"
        position="0 -0.05 0.18"
        rotation="0 180 0"
        visible="false">

        <a-entity
          gltf-model="#asset2"
          auto-fit-model="size: 0.7">
        </a-entity>
      </a-entity>

      <!-- Step 4: Lungs -->
      <a-entity
        id="model3"
        position="0 -0.03 0.18"
        rotation="0 0 0"
        visible="false">

        <a-entity
          gltf-model="#asset3"
          auto-fit-model="size: 0.65">
        </a-entity>
      </a-entity>

      <!-- Step 5: Hand -->
      <a-entity
        id="model4"
        position="0 -0.04 0.18"
        rotation="-20 0 0"
        visible="false">

        <a-entity
          gltf-model="#asset4"
          auto-fit-model="size: 0.65">
        </a-entity>
      </a-entity>

      <!-- Step 6: Heart -->
      <a-entity
        id="model5"
        position="0 -0.03 0.18"
        rotation="0 0 0"
        visible="false">

        <a-entity
          gltf-model="#asset5"
          auto-fit-model="size: 0.6">
        </a-entity>
      </a-entity>

      <!-- Step 7: Rhythm / alarm clock -->
      <a-entity
        id="model6"
        position="0 -0.03 0.18"
        rotation="0 0 0"
        visible="false">

        <a-entity
          gltf-model="#asset6"
          auto-fit-model="size: 0.65">
        </a-entity>
      </a-entity>

      <!-- Step 8: Ambulance -->
      <a-entity
        id="model7"
        position="0 -0.03 0.18"
        rotation="0 0 0"
        visible="false">

        <a-entity
          gltf-model="#asset7"
          auto-fit-model="size: 0.75">
        </a-entity>
      </a-entity>

      <!-- CPR instruction -->
      <a-text
        id="stepText"
        value="STEP 1&#10;Check responsiveness"
        position="0 0.48 0.06"
        width="2.2"
        align="center"
        anchor="center"
        color="#000000"
        scale="0.85 0.85 0.85">
      </a-text>

    </a-entity>
  </a-scene>

  <button
    id="nextButton"
    type="button">
    Next Step
  </button>

  <script>
    const steps = [
      "STEP 1: Check responsiveness",
      "STEP 2: Call emergency services",
      "STEP 3: Open the airway",
      "STEP 4: Check breathing",
      "STEP 5: Place hands on the centre of the chest",
      "STEP 6: Start chest compressions",
      "STEP 7: Push hard and fast at a steady rhythm",
      "STEP 8: Continue until help arrives"
    ];

    const colours = [
      "#1565C0",
      "#EF6C00",
      "#455A64",
      "#00ACC1",
      "#D32F2F",
      "#7B1FA2",
      "#F9A825",
      "#2E7D32"
    ];

    let currentStep = 0;

    const stepText = document.querySelector("#stepText");
    const nextButton = document.querySelector("#nextButton");

    function updateStep() {
      stepText.setAttribute(
        "value",
        steps[currentStep].replace(": ", "\n")
      );

      for (let i = 0; i < steps.length; i++) {
        const modelContainer =
          document.querySelector("#model" + i);

        if (modelContainer) {
          modelContainer.setAttribute(
            "visible",
            i === currentStep
          );
        }
      }

      nextButton.style.backgroundColor = colours[currentStep];
    }

    function nextStep() {
      currentStep =
        (currentStep + 1) % steps.length;

      updateStep();
    }

    nextButton.addEventListener("click", nextStep);

    updateStep();
  </script>

</body>
</html>
