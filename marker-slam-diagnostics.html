<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CPR Marker + SLAM — Position & Rotation Diagnostics</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101820;color:#fff;font-family:system-ui,sans-serif}
canvas{position:fixed;inset:0}
#info{position:fixed;z-index:5;top:10px;left:10px;right:10px;padding:12px;background:#000d;border-radius:12px;white-space:pre-line;font-size:13px;line-height:1.45;pointer-events:none}
#panel{position:fixed;z-index:6;bottom:18px;left:8px;right:8px;display:flex;gap:7px;justify-content:center;flex-wrap:wrap}
button{padding:12px 14px;border:0;border-radius:22px;background:#20c9ad;color:#062722;font-weight:700}button:disabled{opacity:.5}
#setup{position:fixed;z-index:5;top:130px;left:10px;right:10px;background:#000a;padding:12px;border-radius:10px;font-size:14px}input{width:70px}
</style>
</head>
<body>
<div id="info">Marker + SLAM diagnostics. Enter the actual printed image width, then Start AR.</div>
<div id="setup">Printed marker image width: <input id="width" type="number" min="5" max="100" value="15" step="0.5"> cm<br>Reference image: <code>marker_image.png</code> (same GitHub folder)</div>
<div id="panel"><button id="start">Start AR</button><button id="reset" hidden>Reset placement</button><button id="end" hidden>End AR</button></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const $=id=>document.getElementById(id);
const info=$('info'),start=$('start'),reset=$('reset'),end=$('end'),setup=$('setup'),width=$('width');
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.01,100);
const renderer=new THREE.WebGLRenderer({alpha:true,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
renderer.xr.enabled=true;renderer.xr.setReferenceSpaceType('local');
document.body.appendChild(renderer.domElement);
const cube=new THREE.Mesh(new THREE.BoxGeometry(.12,.12,.12),new THREE.MeshBasicMaterial({color:0x00ff66,depthTest:false,depthWrite:false}));
cube.visible=false;cube.renderOrder=10;cube.frustumCulled=false;scene.add(cube);
cube.add(new THREE.LineSegments(new THREE.EdgesGeometry(cube.geometry),new THREE.LineBasicMaterial({color:0x003322,depthTest:false})));
let session=null,anchor=null,anchorPending=false,anchorStatus='not requested',placed=false;
let everTracked=false,trackingState='waiting',lastStatus=0,stableSamples=[],bitmap=null,placementMode='none',poseAvailable=false;
let currentMarkerPose=null,positionDifference=null,rotationDifference=null,initialAnchorOffset=null,initialAnchorRotation=null;
const markerWorld=new THREE.Matrix4(),anchorWorld=new THREE.Matrix4(),markerPosition=new THREE.Vector3(),anchorPosition=new THREE.Vector3(),markerRotation=new THREE.Quaternion(),anchorRotation=new THREE.Quaternion(),referenceOffset=new THREE.Vector3(),referenceRotation=new THREE.Quaternion();
const samplePos=new THREE.Vector3(),sampleQuat=new THREE.Quaternion(),offset=new THREE.Vector3(0,0,.09);
function message(s){info.textContent=s;}
function clearPlacement(){if(anchor){try{anchor.delete()}catch(_){}}anchor=null;anchorPending=false;anchorStatus='not requested';placed=false;cube.visible=false;stableSamples=[];placementMode='none';poseAvailable=false;currentMarkerPose=null;positionDifference=null;rotationDifference=null;initialAnchorOffset=null;initialAnchorRotation=null;}
function cleanup(){session=null;clearPlacement();everTracked=false;trackingState='waiting';start.hidden=false;start.disabled=false;reset.hidden=true;end.hidden=true;setup.hidden=false;}
function setPoseFromXRPose(pose){const p=pose.transform.position,q=pose.transform.orientation;cube.position.set(p.x,p.y,p.z);cube.quaternion.set(q.x,q.y,q.z,q.w);cube.visible=true;}
function setWorldPlacement(pose){const p=pose.transform.position,q=pose.transform.orientation;samplePos.set(p.x,p.y,p.z);sampleQuat.set(q.x,q.y,q.z,q.w);cube.position.copy(samplePos).add(offset.clone().applyQuaternion(sampleQuat));cube.quaternion.copy(sampleQuat);cube.visible=true;placed=true;placementMode='fixed world position (no anchor)';}
start.onclick=async()=>{
 start.disabled=true;let created=null;
 try{
  if(!navigator.xr||!(await navigator.xr.isSessionSupported('immersive-ar')))throw Error('Immersive WebXR AR is unsupported on this device.');
  const cm=Number(width.value);if(!Number.isFinite(cm)||cm<5||cm>100)throw Error('Enter marker image width between 5 and 100 cm.');
  message('Loading marker image...');const response=await fetch('./marker_image.png',{cache:'no-store'});
  if(!response.ok)throw Error('marker_image.png not found: HTTP '+response.status);
  bitmap=await createImageBitmap(await response.blob());
  message('Starting combined marker + SLAM session...');
  created=await navigator.xr.requestSession('immersive-ar',{
   requiredFeatures:['local','image-tracking'],optionalFeatures:['anchors','dom-overlay'],
   domOverlay:{root:document.body},trackedImages:[{image:bitmap,widthInMeters:cm/100}]
  });
  session=created;
  created.addEventListener('end',()=>{if(session===created){cleanup();message('AR ended.');}},{once:true});
  await renderer.xr.setSession(created);
  setup.hidden=true;start.hidden=true;reset.hidden=false;end.hidden=false;
  message('AR started. Hold marker steadily in view for 1–2 seconds.');
  if(typeof created.getImageTrackability==='function'){
   const trackability=await created.getImageTrackability();
   if(trackability[0]==='untrackable')message('This marker image is untrackable on this device.');
  }
 }catch(e){if(created){try{await created.end()}catch(_){}}cleanup();message('AR start failed: '+e.message+'\nTry enabling WebXR Incubations if available.');}
};
reset.onclick=()=>{clearPlacement();message('Placement reset. Keep marker steady to place again.');};
end.onclick=()=>session?.end();
renderer.setAnimationLoop((time,frame)=>{
 if(frame&&session){
  const ref=renderer.xr.getReferenceSpace();
  if(ref){
   try{
    if(typeof frame.getImageTrackingResults!=='function'){
     trackingState='API unavailable';
    }else{
     const results=frame.getImageTrackingResults();
     const image=results.find(r=>r.index===0);
     trackingState=image?.trackingState||'not visible';
     const markerPose=image?.trackingState==='tracked'?frame.getPose(image.imageSpace,ref):null;
     currentMarkerPose=markerPose;
     if(markerPose){
      everTracked=true;
      if(!placed&&!anchorPending){
       const p=markerPose.transform.position;
       const current=new THREE.Vector3(p.x,p.y,p.z);
       stableSamples.push(current);
       if(stableSamples.length>12)stableSamples.shift();
       if(stableSamples.length===12){
        const mean=new THREE.Vector3();for(const v of stableSamples)mean.add(v);mean.multiplyScalar(1/12);
        const maxError=Math.max(...stableSamples.map(v=>v.distanceTo(mean)));
        if(maxError<.035){
         // XRAnchor follows the SLAM world map; the marker imageSpace supplies its initial location.
         if(typeof frame.createAnchor==='function'){
          anchorPending=true;anchorStatus='creating';
          const currentSession=session;
          frame.createAnchor(new XRRigidTransform({x:0,y:0,z:.09}),image.imageSpace).then(a=>{
           if(session!==currentSession){try{a.delete()}catch(_){}return;}
           anchor=a;anchorStatus='created';placed=true;placementMode='WebXR anchor';anchorPending=false;
          }).catch(e=>{
           if(session!==currentSession)return;
           anchorStatus='failed: '+e.message;anchorPending=false;
           setWorldPlacement(markerPose);
          });
         }else{
          anchorStatus='API unsupported';setWorldPlacement(markerPose);
         }
        }
       }
      }
     }else if(!placed&&!anchorPending){stableSamples=[];}
     if(anchor){
      const anchorPose=frame.getPose(anchor.anchorSpace,ref);
      poseAvailable=!!anchorPose;
      if(anchorPose)setPoseFromXRPose(anchorPose);
      else cube.visible=false;
      // Compare the marker-to-anchor transform, not the apparent rotation on screen.
      // Both poses are expressed in the same XR reference space.
      if(anchorPose&&markerPose){
       markerWorld.fromArray(markerPose.transform.matrix);
       anchorWorld.fromArray(anchorPose.transform.matrix);
       markerPosition.setFromMatrixPosition(markerWorld);
       anchorPosition.setFromMatrixPosition(anchorWorld);
       markerRotation.setFromRotationMatrix(markerWorld);
       anchorRotation.setFromRotationMatrix(anchorWorld);
       referenceOffset.copy(anchorPosition).sub(markerPosition).applyQuaternion(markerRotation.clone().invert());
       referenceRotation.copy(markerRotation).invert().multiply(anchorRotation);
       if(initialAnchorOffset===null){initialAnchorOffset=referenceOffset.clone();initialAnchorRotation=referenceRotation.clone();}
       positionDifference=referenceOffset.distanceTo(initialAnchorOffset)*100;
       rotationDifference=THREE.MathUtils.radToDeg(referenceRotation.angleTo(initialAnchorRotation));
      }else{positionDifference=null;rotationDifference=null;}
     }
     // Without an anchor the cube is intentionally NOT moved every frame.
     if(time-lastStatus>1000){
      message('Marker: '+trackingState+' | Ever detected: '+(everTracked?'YES':'NO')+
       '\nPlacement: '+(placed?'YES':'waiting for stable marker')+
       '\nMode: '+placementMode+'\nAnchor: '+anchorStatus+
       '\nAnchor pose: '+(anchor?(poseAvailable?'available':'temporarily unavailable'):'n/a')+
       '\nPosition drift: '+(positionDifference===null?'N/A (marker and anchor must both be visible)':positionDifference.toFixed(1)+' cm')+
       '\nRotation difference: '+(rotationDifference===null?'N/A':rotationDifference.toFixed(1)+'°')+
       '\n'+(placed?'Keep the marker visible while moving to measure relative drift. Reset to repeat.':'Hold phone still and keep the full marker in view.'));
      lastStatus=time;
     }
    }
   }catch(e){if(time-lastStatus>1000){message('Tracking error: '+e.message);lastStatus=time;}}
  }
 }
 renderer.render(scene,camera);
});
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body>
</html>
