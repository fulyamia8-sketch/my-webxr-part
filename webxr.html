<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>CPR Training — WebXR SLAM Test</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #101820; color: white; font-family: system-ui, sans-serif; }
    #info { position: fixed; z-index: 10; top: 12px; left: 12px; right: 12px; padding: 12px 14px; border-radius: 12px; background: rgba(0,0,0,.72); font-size: 14px; line-height: 1.45; pointer-events: none; }
    #start { position: fixed; z-index: 11; left: 50%; bottom: 28px; transform: translateX(-50%); border: 0; border-radius: 999px; background: #14b8a6; color: #062c2a; padding: 14px 24px; font-weight: 700; font-size: 16px; }
    #start:disabled { opacity: .5; }
    canvas { display: block; }
  </style>
</head>
<body>
  <div id="info">WebXR + SLAM test: Press Start AR, slowly point your camera at a well-lit floor or table, then tap the screen to place the cube.</div>
  <button id="start">Start AR</button>
  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';

    const info = document.querySelector('#info');
    const start = document.querySelector('#start');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.01, 30);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xffffff, 0x777777, 2));
    const cube = new THREE.Mesh(
      new THREE.BoxGeometry(0.12, 0.12, 0.12),
      new THREE.MeshStandardMaterial({ color: 0x14b8a6, roughness: 0.4 })
    );
    cube.visible = false;
    scene.add(cube);

    const reticle = new THREE.Mesh(
      new THREE.RingGeometry(0.07, 0.085, 32).rotateX(-Math.PI / 2),
      new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide })
    );
    reticle.matrixAutoUpdate = false;
    reticle.visible = false;
    scene.add(reticle);

    let hitTestSource = null;
    let referenceSpace = null;
    let requestedHitTestSource = false;

    if (!navigator.xr) {
      start.disabled = true;
      info.textContent = 'WebXR is not available in this browser. Use a supported ARCore Android device with Chrome over HTTPS.';
    } else {
      navigator.xr.isSessionSupported('immersive-ar').then(supported => {
        if (!supported) {
          start.disabled = true;
          info.textContent = 'This device/browser does not support immersive-ar. Try ARCore-compatible Android Chrome.';
        }
      }).catch(err => { info.textContent = 'WebXR compatibility check failed: ' + err.message; });
    }

    start.addEventListener('click', async () => {
      start.disabled = true;
      try {
        const session = await navigator.xr.requestSession('immersive-ar', {
          requiredFeatures: ['hit-test', 'local'],
          optionalFeatures: ['dom-overlay'],
          domOverlay: { root: document.body }
        });
        session.addEventListener('end', () => {
          hitTestSource?.cancel();
          hitTestSource = null;
          referenceSpace = null;
          requestedHitTestSource = false;
          reticle.visible = false;
          start.disabled = false;
          start.style.display = '';
          info.textContent = 'AR session ended. Press Start AR to try again.';
        });
        await renderer.xr.setSession(session);
        start.style.display = 'none';
        info.textContent = 'Move slowly to detect a surface. Tap anywhere when the white ring appears.';
        const controller = renderer.xr.getController(0);
        controller.addEventListener('select', () => {
          if (reticle.visible) {
            cube.position.setFromMatrixPosition(reticle.matrix);
            cube.position.y += 0.06;
            cube.visible = true;
            info.textContent = 'Cube placed. Walk around: it should stay in the same real-world position.';
          }
        });
        scene.add(controller);
      } catch (err) {
        start.disabled = false;
        info.textContent = 'Could not start AR: ' + err.message;
      }
    });

    renderer.setAnimationLoop((timestamp, frame) => {
      if (frame) {
        const session = renderer.xr.getSession();
        if (!requestedHitTestSource) {
          requestedHitTestSource = true;
          Promise.all([
            session.requestReferenceSpace('viewer'),
            session.requestReferenceSpace('local')
          ]).then(([viewerSpace, localSpace]) => {
            referenceSpace = localSpace;
            return session.requestHitTestSource({ space: viewerSpace });
          }).then(source => { hitTestSource = source; })
            .catch(err => { info.textContent = 'Hit-test setup failed: ' + err.message; });
        }
        if (hitTestSource && referenceSpace) {
          const hits = frame.getHitTestResults(hitTestSource);
          if (hits.length) {
            const pose = hits[0].getPose(referenceSpace);
            reticle.visible = true;
            reticle.matrix.fromArray(pose.transform.matrix);
          } else {
            reticle.visible = false;
          }
        }
      }
      renderer.render(scene, camera);
    });
    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
